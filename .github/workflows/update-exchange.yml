name: Refresh bilateral exchange dashboard

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/us_china_exchange/**"
      - "src/weibo_media/**"
      - "scripts/*exchange*"
      - "scripts/update.py"
      - "scripts/build_site.py"
      - "scripts/build_weibo_summary.py"
      - "scripts/check_weibo_publication.py"
      - "scripts/refresh_weibo.py"
      - "scripts/install_weibo_refresh.py"
      - "scripts/build_language_data.py"
      - "scripts/build_confucius_data.py"
      - "scripts/check_confucius_publication.py"
      - "scripts/build_business_data.py"
      - "scripts/build_business_current_data.py"
      - "scripts/build_business_inward_data.py"
      - "scripts/build_immigration_data.py"
      - "scripts/build_state_immigration_data.py"
      - "scripts/build_opinion_data.py"
      - "scripts/check_opinion_publication.py"
      - "scripts/check_public_freshness.py"
      - "scripts/sync_published_figures.py"
      - "scripts/check_state_immigration_map.py"
      - "scripts/build_travel_data.py"
      - "scripts/build_contact_backfill.py"
      - "scripts/build_tourism_backfill.py"
      - "scripts/build_student_estimates.py"
      - "scripts/build_business_publication.py"
      - "scripts/check_business_publication.py"
      - "scripts/build_exchange_publication.py"
      - "scripts/check_exchange_publication.py"
      - "scripts/check_language_releases.py"
      - "data/site/weibo_summary.json"
      - "data/site/language_learning.json"
      - "data/site/confucius_programs.json"
      - "data/reviewed/confucius-snapshots.json"
      - "data/reviewed/language-snapshot-2020.json"
      - "data/site/business_presence.json"
      - "data/site/business_current.json"
      - "data/site/business_inward.json"
      - "data/site/immigration.json"
      - "data/site/state_immigration.json"
      - "data/site/opinions.json"
      - "data/reviewed/opinion-warmth.json"
      - "data/site/us_states.geojson"
      - "data/site/student_estimates.json"
      - "data/site/gap_review.csv"
      - "tests/test_exchange*"
      - "tests/test_weibo*"
      - "tests/test_pipeline.py"
      - "tests/fixtures/exchange*"
      - "requirements-exchange*"
      - ".github/workflows/update-exchange.yml"

permissions:
  contents: write

concurrency:
  group: exchange-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-exchange-dev.txt
      - name: Install declared dependencies
        run: |
          python -m pip install -q -r requirements-exchange-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check existing publication and parsers
        run: |
          PYTHONPATH=src python -m pytest tests/test_exchange_*.py tests/test_weibo_activity.py tests/test_weibo_refresh.py tests/test_pipeline.py -q
          python scripts/build_site.py
          python scripts/check_exchange_browser.py
          python scripts/build_exchange_publication.py --output data/local/collective-publication
          python scripts/check_exchange_publication.py --site data/local/collective-publication
      - name: Check for newer nationwide language-enrollment releases
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/check_language_releases.py
      - name: Reconcile all available source history
        run: python scripts/update.py
      - name: Check the public Confucius-program directory for changes
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/build_confucius_data.py --check-only
      - name: Check for newer complete state immigration estimates
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/build_state_immigration_data.py
      - name: Recheck reviewed public-opinion releases
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/build_opinion_data.py
      - name: Build and check candidate publication
        run: |
          python scripts/build_site.py
          PYTHONPATH=src python -m pytest tests/test_exchange_*.py tests/test_weibo_activity.py tests/test_weibo_refresh.py tests/test_pipeline.py -q
          python scripts/build_site.py
          python scripts/check_exchange_browser.py
          python scripts/build_exchange_publication.py --output data/local/collective-publication
          python scripts/check_exchange_publication.py --site data/local/collective-publication
          python scripts/check_business_publication.py --site data/local/collective-publication
          python scripts/check_public_freshness.py --site data/local/collective-publication
          python scripts/check_state_immigration_map.py --site data/local/collective-publication
          python scripts/check_opinion_publication.py --site data/local/collective-publication
          python scripts/check_confucius_publication.py --site data/local/collective-publication
          python scripts/check_weibo_publication.py --site data/local/collective-publication
          python scripts/audit_exchange_plots.py --site data/local/collective-publication --output data/local/plot-audit
          python scripts/sync_published_figures.py --site data/local/collective-publication
          git diff --check
      - name: Record actual check status
        if: always()
        run: |
          if test -f data/local/exchange/check.json; then
            echo '### Bilateral exchange source checks' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/local/exchange/check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f data/local/language-release-check.json; then
            echo '### National language-enrollment release check' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/local/language-release-check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f data/local/state-immigration/check.json; then
            echo '### Complete state immigration release check' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/local/state-immigration/check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f data/local/opinions/check.json; then
            echo '### Reviewed public-opinion source check' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/local/opinions/check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f data/local/confucius/check.json; then
            echo '### Confucius-program source check' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/local/confucius/check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain check log and candidate site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-publication-${{ github.run_id }}
          path: |
            data/local/exchange/check.json
            data/local/language-release-check.json
            data/local/state-immigration/check.json
            data/local/opinions/check.json
            data/local/confucius/check.json
            data/local/plot-audit/audit.json
            site/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit meaningful publication changes as Hans Hanley
        run: |
          git config user.name "Hans Hanley"
          git config user.email "hwahhanley@gmail.com"
          git add -- data/site/observations.json data/site/sources.json data/site/coverage.json data/site/state_immigration.json data/site/us_states.geojson data/site/opinions.json site outputs/figures
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified bilateral exchange publication"
            git push origin HEAD:main
          fi
