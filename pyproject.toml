[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-media"
version = "0.1.0"
description = "Evidence-backed U.S. news-media Weibo inventory and recoverable post corpus"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
weibo-media = "weibo_media.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
