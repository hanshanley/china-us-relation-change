<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Earlier Chinese views of the U.S." data-axis-max="100"><title>Earlier Chinese views of the U.S.</title><desc>Reported survey estimates. Percent favorable and 0-100 mean ratings are separate measures; actual age bands and survey periods are retained.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Earlier Chinese views of the U.S.</text><text x="115" y="77" font-size="18">Pew Research Center | historical survey rounds, 2010-2016</text><text class="axis-unit" x="115" y="145" font-size="18">Percent favorable</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">50</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">100</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2010" data-label="Spring 2010" data-value="58" data-period="Spring 2010" data-reported-value="58" data-reported-unit="Percent favorable" data-status="observed" x="132.89" y="275.00" width="83.5" height="145.00" fill="#7B2D26"/><text x="174.64" y="263.00" text-anchor="middle" fill="#1A1A1A">58</text><text x="174.64" y="450" text-anchor="middle" font-size="18">Spring 2010</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2011" data-label="Spring 2011" data-value="44" data-period="Spring 2011" data-reported-value="44" data-reported-unit="Percent favorable" data-status="observed" x="252.18" y="310.00" width="83.5" height="110.00" fill="#7B2D26"/><text x="293.93" y="298.00" text-anchor="middle" fill="#1A1A1A">44</text><text x="293.93" y="450" text-anchor="middle" font-size="18">Spring 2011</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2012" data-label="Spring 2012" data-value="43" data-period="Spring 2012" data-reported-value="43" data-reported-unit="Percent favorable" data-status="observed" x="371.46" y="312.50" width="83.5" height="107.50" fill="#7B2D26"/><text x="413.21" y="300.50" text-anchor="middle" fill="#1A1A1A">43</text><text x="413.21" y="450" text-anchor="middle" font-size="18">Spring 2012</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2013" data-label="Spring 2013" data-value="40" data-period="Spring 2013" data-reported-value="40" data-reported-unit="Percent favorable" data-status="observed" x="490.75" y="320.00" width="83.5" height="100.00" fill="#7B2D26"/><text x="532.50" y="308.00" text-anchor="middle" fill="#1A1A1A">40</text><text x="532.50" y="450" text-anchor="middle" font-size="18">Spring 2013</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2014" data-label="Spring 2014" data-value="50" data-period="Spring 2014" data-reported-value="50" data-reported-unit="Percent favorable" data-status="observed" x="610.04" y="295.00" width="83.5" height="125.00" fill="#7B2D26"/><text x="651.79" y="283.00" text-anchor="middle" fill="#1A1A1A">50</text><text x="651.79" y="450" text-anchor="middle" font-size="18">Spring 2014</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2015" data-label="Spring 2015" data-value="44" data-period="Spring 2015" data-reported-value="44" data-reported-unit="Percent favorable" data-status="observed" x="729.32" y="310.00" width="83.5" height="110.00" fill="#7B2D26"/><text x="771.07" y="298.00" text-anchor="middle" fill="#1A1A1A">44</text><text x="771.07" y="450" text-anchor="middle" font-size="18">Spring 2015</text><rect class="opinion-point" data-series-id="pew_china:favorable" data-year="2016" data-label="Spring 2016" data-value="50" data-period="Spring 2016" data-reported-value="50" data-reported-unit="Percent favorable" data-status="observed" x="848.61" y="295.00" width="83.5" height="125.00" fill="#7B2D26"/><text x="890.36" y="283.00" text-anchor="middle" fill="#1A1A1A">50</text><text x="890.36" y="450" text-anchor="middle" font-size="18">Spring 2016</text><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Pew Research Center, October 2016, published net percentages. Historical sample coverage varies; bars do</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">not imply a continuous national probability trend. Unfavorable answers are also retained in the complete</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">download. No connection to the different China Pulse scale is drawn.</text></g></svg>
