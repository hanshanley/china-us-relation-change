ss</text><rect class="data-bar" data-label="Unknown completeness" data-value="0" x="380" y="391" width="0.00" height="36" fill="#6B6B6B"/><text x="392.00" y="416" fill="#1A1A1A">0</text><text class="figure-source" x="80" y="510" font-size="15" font-style="italic">Source: local Weibo identity registry and recovered-corpus metadata; public aggregates only.</text><text class="figure-source" x="80" y="531" font-size="15" font-style="italic">Recovery is partial, not total posting or popularity. Source-full is the full accessible source</text><text class="figure-source" x="80" y="552" font-size="15" font-style="italic">body, not an independently verified complete original.</text></g></svg>
