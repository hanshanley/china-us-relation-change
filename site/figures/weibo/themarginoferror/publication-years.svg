 fill="#3D6F8C"/><text x="532.50" y="399.91" text-anchor="middle" fill="#1A1A1A">194</text><text x="532.50" y="455" text-anchor="middle">2023</text><rect class="data-bar" data-label="2024" data-value="100" x="616.00" y="414.80" width="71.57" height="5.20" fill="#3D6F8C"/><text x="651.79" y="404.80" text-anchor="middle" fill="#1A1A1A">100</text><text x="651.79" y="455" text-anchor="middle">2024</text><rect class="data-bar" data-label="2025" data-value="219" x="735.29" y="408.61" width="71.57" height="11.39" fill="#3D6F8C"/><text x="771.07" y="398.61" text-anchor="middle" fill="#1A1A1A">219</text><text x="771.07" y="455" text-anchor="middle">2025</text><rect class="data-bar" data-label="2026" data-value="3787" x="854.57" y="223.08" width="71.57" height="196.92" fill="#3D6F8C"/><text x="890.36" y="213.08" text-anchor="middle" fill="#1A1A1A">3,787</text><text x="890.36" y="455" text-anchor="middle">2026</text><text class="figure-source" x="80" y="510" font-size="15" font-style="italic">Source: local Weibo identity registry and recovered-corpus metadata; public aggregates only.</text><text class="figure-source" x="80" y="531" font-size="15" font-style="italic">Recovery is partial, not total posting or popularity. Publication years use Asia/Shanghai. Coverage</text><text class="figure-source" x="80" y="552" font-size="15" font-style="italic">and collection effort vary; this is not a posting-activity trend or a causal measure. Unobserved</text><text class="figure-source" x="80" y="573" font-size="15" font-style="italic">years are not zero activity.</text></g></svg>
