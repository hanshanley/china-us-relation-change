 fill="#3D6F8C"/><text x="532.50" y="396.48" text-anchor="middle" fill="#1A1A1A">260</text><text x="532.50" y="455" text-anchor="middle">2023</text><rect class="data-bar" data-label="2024" data-value="191" x="616.00" y="410.07" width="71.57" height="9.93" fill="#3D6F8C"/><text x="651.79" y="400.07" text-anchor="middle" fill="#1A1A1A">191</text><text x="651.79" y="455" text-anchor="middle">2024</text><rect class="data-bar" data-label="2025" data-value="304" x="735.29" y="404.19" width="71.57" height="15.81" fill="#3D6F8C"/><text x="771.07" y="394.19" text-anchor="middle" fill="#1A1A1A">304</text><text x="771.07" y="455" text-anchor="middle">2025</text><rect class="data-bar" data-label="2026" data-value="4316" x="854.57" y="195.57" width="71.57" height="224.43" fill="#3D6F8C"/><text x="890.36" y="185.57" text-anchor="middle" fill="#1A1A1A">4,316</text><text x="890.36" y="455" text-anchor="middle">2026</text><text class="figure-source" x="80" y="510" font-size="15" font-style="italic">Source: local Weibo identity registry and recovered-corpus metadata; public aggregates only.</text><text class="figure-source" x="80" y="531" font-size="15" font-style="italic">Recovery is partial, not total posting or popularity. Publication years use Asia/Shanghai. Coverage</text><text class="figure-source" x="80" y="552" font-size="15" font-style="italic">and collection effort vary; this is not a posting-activity trend or a causal measure. Unobserved</text><text class="figure-source" x="80" y="573" font-size="15" font-style="italic">years are not zero activity.</text></g></svg>
