 cy="242.75" r="4" fill="#C2993E"><title>United Kingdom 2018: 709.0000 Enterprises</title></circle><circle class="business-point" data-series-id="eurostat_uk:china" data-year="2019" data-value="531" cx="804.78" cy="287.25" r="4" fill="#C2993E"><title>United Kingdom 2019: 531.0000 Enterprises</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Eurostat history; ONS revised 2018/2019 estimates. Survey breaks and 2018 source/sector boundary</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">disconnected. ONS total activity includes agriculture. No later outward-affiliate counts verified; do not</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">fill with inward or FDI data. Includes source estimates.</text></g></svg>
