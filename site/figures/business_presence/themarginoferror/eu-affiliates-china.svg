27-controlled affiliates 2021: 6,900.0000 Enterprises</title></circle><circle class="business-point" data-series-id="eurostat_affiliates:china" data-year="2022" data-value="7191" cx="913.70" cy="220.25" r="4" fill="#7B2D26"><title>EU27-controlled affiliates 2022: 7,191.0000 Enterprises</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Eurostat outward FATS, NACE B-S except O. Enterprise units, not European parent counts or all Europe.</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">Confidential/missing years are gaps; 2021 method boundary disconnected. Not matched to BEA size or</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">ownership coverage. 2023 confidential. Includes source estimates.</text></g></svg>
