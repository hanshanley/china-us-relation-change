ata-status="observed" cx="323.75" cy="232.50" r="0" fill="#8A7377"><title>Hungary (enterprise definition) 2022: 6.0000 Enterprises</title></circle><rect class="annual-column" data-series-id="eurostat_hungary:china" data-year="2023" data-value="6" x="709.25" y="232.50" width="64.00" height="187.50" fill="#8A7377"/><circle class="business-point" data-series-id="eurostat_hungary:china" data-year="2023" data-value="6" data-period="2023" data-reported-value="6" data-reported-unit="enterprises" data-status="observed" cx="741.25" cy="232.50" r="0" fill="#8A7377"><title>Hungary (enterprise definition) 2023: 6.0000 Enterprises</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Eurostat / HCSO / MNB. Enterprises from 2022; separate 2007-2021 legal-unit archive in downloads (10</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">confidential cells). Conflicting unit/comparability rules: no 2019 growth. Current reporting frame: above</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">EUR 40k/10% capital; separate HUF 10m wording. Minority control reviewed; nonrespondents omitted. Not all</text><text class="figure-source" x="115" y="580" font-size="14" font-style="italic">firms or proven constant historical cutoffs. National 2024 aggregates are not China counts.</text></g></svg>
