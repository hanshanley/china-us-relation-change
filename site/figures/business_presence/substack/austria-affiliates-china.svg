terprises" data-status="observed" cx="254.17" cy="226.25" r="0" fill="#8A6F64"><title>Austria (Eurostat enterprises) 2021: 155.0000 Enterprises</title></circle><rect class="annual-column" data-series-id="eurostat_austria:china" data-year="2022" data-value="166" x="500.50" y="212.50" width="64.00" height="207.50" fill="#8A6F64"/><circle class="business-point" data-series-id="eurostat_austria:china" data-year="2022" data-value="166" data-period="2022" data-reported-value="166" data-reported-unit="enterprises" data-status="observed" cx="532.50" cy="212.50" r="0" fill="#8A6F64"><title>Austria (Eurostat enterprises) 2022: 166.0000 Enterprises</title></circle><rect class="annual-column" data-series-id="eurostat_austria:china" data-year="2023" data-value="175" x="778.83" y="201.25" width="64.00" height="218.75" fill="#8A6F64"/><circle class="business-point" data-series-id="eurostat_austria:china" data-year="2023" data-value="175" data-period="2023" data-reported-value="175" data-reported-unit="enterprises" data-status="observed" cx="810.83" cy="201.25" r="0" fill="#8A6F64"><title>Austria (Eurostat enterprises) 2023: 175.0000 Enterprises</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Eurostat / Statistics Austria, Austria-resident ultimate control. Supplementary enterprise counts start in</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">2021. The 2007-2020 legal-unit history remains separate in complete downloads, not joined here. Foreign</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">legal units remain an imperfect enterprise proxy. Broader national resident-parent counts and the 2024</text><text class="figure-source" x="115" y="580" font-size="14" font-style="italic">control snapshot are not spliced into this population.</text></g></svg>
