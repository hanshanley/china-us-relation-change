<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Belgian-controlled enterprises in China" data-plot-style="columns"><title>Belgian-controlled enterprises in China</title><desc>Business entity counts, not people, branch locations or cross-border flows. Exact definitions and observations accompany this figure.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Belgian-controlled enterprises in China</text><text x="115" y="77" font-size="18">China except Hong Kong | Since 2022 | Thresholded reporting frame</text><text class="axis-unit" x="115" y="145" font-size="18">Enterprises</text><path d="M115 108h25" stroke="#7B7F60" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">Belgium (enterprise definition)</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">50</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">100</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="323.75" y="457" text-anchor="middle" font-size="18">2022</text><text class="year-tick" x="741.25" y="457" text-anchor="middle" font-size="18">2023</text><rect class="annual-column" data-series-id="eurostat_belgium:china" data-year="2022" data-value="72" x="291.75" y="240.00" width="64.00" height="180.00" fill="#7B7F60"/><circle class="business-point" data-series-id="eurostat_belgium:china" data-year="2022" data-value="72" data-period="2022" data-reported-value="72" data-reported-unit="enterprises" data-status="observed" cx="323.75" cy="240.00" r="0" fill="#7B7F60"><title>Belgium (enterprise definition) 2022: 72.0000 Enterprises</title></circle><rect class="annual-column" data-series-id="eurostat_belgium:china" data-year="2023" data-value="80" x="709.25" y="220.00" width="64.00" height="200.00" fill="#7B7F60"/><circle class="business-point" data-series-id="eurostat_belgium:china" data-year="2023" data-value="80" data-period="2023" data-reported-value="80" data-reported-unit="enterprises" data-status="observed" cx="741.25" cy="220.00" r="0" fill="#7B7F60"><title>Belgium (enterprise definition) 2023: 80.0000 Enterprises</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">Eurostat / National Bank of Belgium. Enterprise counts start 2022; older UCI legal units and pre-UCI</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">records remain separate in complete downloads. Reporting-unit frame cutoffs: EUR 30m equity, 75m assets or</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">15m long-term investments, any criterion; not all Belgian firms or verified constant historical limits.</text><text class="figure-source" x="115" y="580" font-size="14" font-style="italic">Method windows differ; no comparable 2019 change.</text></g></svg>
