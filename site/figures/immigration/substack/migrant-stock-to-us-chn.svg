<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="China- and Hong Kong-born residents in the U.S." data-plot-style="columns" data-geographies="CHN" data-first-year="2000" data-last-year="2024"><title>China- and Hong Kong-born residents in the U.S.</title><desc>Same observation years; separate vertical scales. Resident stocks and status grants retain their source populations and periods.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">China- and Hong Kong-born residents in the U.S.</text><text x="115" y="77" font-size="18">Mainland China | UN estimates | actual 1 July benchmarks, 2000–2024</text><text class="axis-unit" x="115" y="145" font-size="18">Estimated residents</text><rect class="covid-band" data-start-year="2020" data-end-year="2022" x="783.00" y="170" width="100.20" height="250" fill="#D6D3CC" fill-opacity=".3" pointer-events="none"/><text class="covid-label" x="833.10" y="160" text-anchor="middle" font-size="12" fill="#6B6B6B">COVID travel restrictions</text><path d="M115 108h25" stroke="#7B2D26" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">China-born in the U.S.</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">1.5M</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">3M</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="131.70" y="457" text-anchor="middle" font-size="18">2000</text><text class="year-tick" x="298.70" y="457" text-