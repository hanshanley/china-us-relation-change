l-column" data-series-id="un_stock:CHN:USA" data-year="2015" data-value="2101592" x="620.68" y="244.87" width="24.05" height="175.13" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:CHN:USA" data-year="2015" data-value="2101592" data-period="1 July 2015" data-reported-value="2101592" data-reported-unit="estimated residents" data-status="estimated" cx="632.70" cy="244.87" r="0" fill="#7B2D26"><title>China-born in the U.S. 2015: 2,101,592.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:CHN:USA" data-year="2020" data-value="2255170" x="787.68" y="232.07" width="24.05" height="187.93" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:CHN:USA" data-year="2020" data-value="2255170" data-period="1 July 2020" data-reported-value="2255170" data-reported-unit="estimated residents" data-status="estimated" cx="799.70" cy="232.07" r="0" fill="#7B2D26"><title>China-born in the U.S. 2020: 2,255,170.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:CHN:USA" data-year="2024" data-value="2488775" x="921.28" y="212.60" width="24.05" height="207.40" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:CHN:USA" data-year="2024" data-value="2488775" data-period="1 July 2024" data-reported-value="2488775" data-reported-unit="estimated residents" data-status="estimated" cx="933.30" cy="212.60" r="0" fill="#7B2D26"><title>China-born in the U.S. 2024: 2,488,775.0000 Estimated residents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">UN DESA, International Migrant Stock 2024, Table 1 (CC BY 3.0 IGO). Foreign-born resident stocks, not</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">annual arrivals, green-card grants or net migration. Only published benchmark years are shown; no invented</text><text class="figure-source" x="115" y="560" font-size="14"