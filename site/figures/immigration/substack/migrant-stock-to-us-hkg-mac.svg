<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="China- and Hong Kong-born residents in the U.S." data-geographies="HKG" data-first-year="2000" data-last-year="2024"><title>China- and Hong Kong-born residents in the U.S.</title><desc>Same observation years; separate vertical scales. Resident stocks and status grants retain their source populations and periods.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">China- and Hong Kong-born residents in the U.S.</text><text x="115" y="77" font-size="18">Hong Kong | UN estimates | actual 1 July benchmarks, 2000–2024</text><text class="axis-unit" x="115" y="145" font-size="18">Estimated residents</text><path d="M115 108h25" stroke="#3D6F8C" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">Hong Kong-born in the U.S.</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">200k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">400k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="115.00" y="457" text-anchor="middle" font-size="18">2000</text><text class="year-tick" x="288.96" y="457" text-anchor="middle" font-size="18">2005</text><text class="year-tick" x="462.92" y="457" text-anchor="middle" font-size="18">2010</text><text class="year-tick" x="636.88" y="457" text-anchor="middle" font-size="18">2015</text><text class="year-tick" x="810.83" y="457" text-anchor="middle" font-size="18">2020</text><text class="year-tick" x="950.00" y="457" text-anchor="middle" font-size="18">2024</text><path class="data-line" data-series-id="un_stock:HKG:USA" d="M115.00,288.45 L288.96,286.17 L462.92,285.20 L636.88,267.13 L810.83,258.48 L950.00,251.93" stroke="#3D6F8C" stroke-width="3" fill="none"/><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2000" data-value="210485" data-period="1 July 2000" data-reported-value="210485" data-reported-unit="estimated residents" data-status="estimated" cx="115.00" cy="288.45" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2000: 210,485.0000 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2005" data-value="214124" data-period="1 July 2005" data-reported-value="214124" data-reported-unit="estimated residents" data-status="estimated" cx="288.96" cy="286.17" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2005: 214,124.0000 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2010" data-value="215677" data-period="1 July 2010" data-reported-value="215677" data-reported-unit="estimated residents" data-status="estimated" cx="462.92" cy="285.20" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2010: 215,677.0000 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2015" data-value="244595" data-period="1 July 2015" data-reported-value="244595" data-reported-unit="estimated residents" data-status="estimated" cx="636.88" cy="267.13" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2015: 244,595.0000 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2020" data-value="258439" data-period="1 July 2020" data-reported-value="258439" data-reported-unit="estimated residents" data-status="estimated" cx="810.83" cy="258.48" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2020: 258,439.0000 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:HKG:USA" data-year="2024" data-value="268915" data-period="1 July 2024" data-reported-value="268915" data-reported-unit="estimated residents" data-status="estimated" cx="950.00" cy="251.93" r="4" fill="#3D6F8C"><title>Hong Kong-born in the U.S. 2024: 268,915.0000 Estimated residents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">UN DESA, International Migrant Stock 2024, Table 1 (CC BY 3.0 IGO). Foreign-born resident stocks, not</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">annual arrivals, green-card grants or net migration. Only published benchmark years are shown; no invented</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">annual counts.</text></g></svg>
