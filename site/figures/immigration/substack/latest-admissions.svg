<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="FY2025: arrivals and status adjustments"><title>FY2025: arrivals and status adjustments</title><desc>Resident stocks and status grants have distinct periods and populations; not all physical arrivals.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">FY2025: arrivals and status adjustments</text><text x="115" y="77" font-size="18">DHS China-nationality category | NOT the birthplace series</text><text class="axis-unit" x="115" y="145" font-size="18">Status grants</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">25k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">50k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><rect class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2025" data-value="27020" data-period="FY2025" data-reported-value="27020" data-reported-unit="status grants" data-status="rounded" x="258.75" y="284.90" width="130" height="135.10" fill="#7B2D26"/><text x="323.75" y="272.90" text-anchor="middle" fill="#1A1A1A">27,020</text><text x="323.75" y="450" text-anchor="middle">2025</text><text x="323.75" y="478" text-anchor="middle" font-size="18">New arrivals</text><rect class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2025" data-value="38650" data-period="FY2025" data-reported-value="38650" data-reported-unit="status grants" data-status="rounded" x="676.25" y="226.75" width="130" height="193.25" fill="#7B2D26"/><text x="741.25" y="214.75" text-anchor="middle" fill="#1A1A1A">38,650</text><text x="741.25" y="450" text-anchor="middle">2025</text><text x="741.25" y="478" text-anchor="middle" font-size="18">Adjustments within the U.S.</text><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">DHS/OHSS reports 65,670 total FY2025 China-nationality grants: 27,020 new arrivals and 38,650 adjustments</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">within the U.S. Rounded to nearest ten. Nationality differs from birthplace: do not splice this into the</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">historical line.</text></g></svg>
