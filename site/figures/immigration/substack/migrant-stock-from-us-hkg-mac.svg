00 Estimated residents</title></circle><circle class="immigration-point" data-series-id="un_stock:USA:HKG" data-year="2024" data-value="14298" data-period="1 July 2024" data-reported-value="14298" data-reported-unit="estimated residents" data-status="estimated" cx="950.00" cy="241.28" r="4" fill="#3D6F8C"><title>U.S.-born in Hong Kong 2024: 14,298.0000 Estimated residents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">UN DESA, International Migrant Stock 2024 (CC BY 3.0 IGO). Mainland China uses U.S. citizenship (C R);</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">Hong Kong uses U.S. birthplace (B R). Stocks on 1 July, not new immigrants, permanent-residency grants or</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">U.S. departures. Do not add the two populations.</text></g></svg>
