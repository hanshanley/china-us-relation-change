<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Chinese nationals gaining residency while in the U.S." data-plot-style="columns"><title>Chinese nationals gaining residency while in the U.S.</title><desc>Resident stocks and status grants have distinct periods and populations; not all physical arrivals.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Chinese nationals gaining residency while in the U.S.</text><text x="115" y="77" font-size="18">Status adjustments | U.S. fiscal years 2020-2025</text><text class="axis-unit" x="115" y="145" font-size="18">People per fiscal year</text><rect class="covid-band" data-start-year="2020" data-end-year="2022" x="115.00" y="170" width="417.50" height="250" fill="#D6D3CC" fill-opacity=".3" pointer-events="none"/><text class="covid-label" x="323.75" y="160" text-anchor="middle" font-size="12" fill="#6B6B6B">COVID travel restrictions</text><path d="M115 108h25" stroke="#6B6B6B" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">Adjustments within the U.S.</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">30k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">60k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="184.58" y="457" text-anchor="middle" font-size="18">2020</text><text class="year-tick" x="880.42" y="457" text-anchor="middle" font-size="18">2025</text><rect class="annual-column" data-series-id="ohss