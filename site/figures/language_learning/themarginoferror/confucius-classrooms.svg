<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-classrooms" data-chart-layout="timeline" data-axis-max="600" data-first-year="2014" data-last-year="2019" aria-label="Confucius Classrooms: historical U.S. reports" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Confucius Classrooms: historical U.S. reports</title><desc>National reports use different program/site counting rules. The 2024 inventory and today&#x27;s directory listings are not appended as active-classroom totals. No decline rate is calculated.</desc><rect class="chart-background" width="1000" height="600" fill="#F7F5F0"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Confucius Classrooms: historical U.S. reports</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Reported programs or school sites | not physical rooms</text><path class="confucius-grid" data-tick="0" d="M94,452.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="456.00" text-anchor="end" font-size="13" fill="#6B6B6B">0</text><path class="confucius-grid" data-tick="100" d="M94,397.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="401.00" text-anchor="end" font-size="13" fill="#6B6B6B">100</text><path class="confucius-grid" data-tick="200" d="M94,342.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="346.00" text-anchor="end" font-size="13" fill="#6B6B6B">200</text><path class="confucius-grid" data-tick="300" d="M94,287.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="291.00" text-anchor="end" font-size="13" fill="#6B6B6B">300</text><path class="confucius-grid" data-tick="400" d="M94,232.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="236.00" text-anchor="end" font-size="13" fill="#6B6B6B">400</text><path class="confucius-grid" data-tick="500" d="M94,177.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="181.00" text-anchor="end" font-size="13" fill="#6B6B6B">500</text><path class="confucius-grid" data-tick="600" d="M94,122.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="126.00" text-anchor="end" font-size="13" fill="#6B6B6B">600</text><text class="confucius-unit" x="94" y="105" font-size="14" fill="#6B6B6B">Reported programs / sites</text><text class="confucius-year" x="176.06" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2014</text><text class="confucius-year" x="312.84" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2015</text><text class="confucius-year" x="449.61" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2016</text><text class="confucius-year" x="586.39" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2017</text><text class="confucius-year" x="723.16" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2018</text><text class="confucius-year" x="859.94" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2019</text><text x="518.0" y="513" text-anchor="middle" font-size="13" fill="#6B6B6B">Observation year</text><g class="confucius-mark" data-observation-id="mfa_2014_classrooms_reported" data-value="366" data-bound="" data-qualifier="exact" data-reference="2014-09-29" data-observation-year="2014"><title>Sep 29, 2014: 366 reported classrooms or school sites. China Ministry of Foreign Affairs. Official statement; source counting definitions not independently harmonized.</title><text class="confucius-reported" x="176.06" y="238.70" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">366</text><rect class="confucius-bar" x="155.06" y="250.70" width="42.00" height="201.30" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_2017_classrooms_reported" data-value="501" data-bound="" data-qualifier="exact" 