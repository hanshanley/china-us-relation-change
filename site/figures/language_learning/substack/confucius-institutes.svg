<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-institutes" data-chart-layout="timeline" data-axis-max="125.0" data-first-year="2006" data-last-year="2023" aria-label="Confucius Institutes: reported U.S. counts" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Confucius Institutes: reported U.S. counts</title><desc>Different sources, not a harmonized annual census. The June 2023 roster includes non-university hosts and one paused institute. Announced closures are not effective closure dates.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Confucius Institutes: reported U.S. counts</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Reported observations by year | unreported years remain blank</text><path class="confucius-grid" data-tick="0" d="M94,452.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="456.00" text-anchor="end" font-size="13" fill="#6B6B6B">0</text><path class="confucius-grid" data-tick="25" d="M94,386.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="390.00" text-anchor="end" font-size="13" fill="#6B6B6B">25</text><path class="confucius-grid" data-tick="50" d="M94,320.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="324.00" text-anchor="end" font-size="13" fill="#6B6B6B">50</text><path class="confucius-grid" data-tick="75" d="M94,254.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="258.00" text-anchor="end" font-size="13" fill="#6B6B6B">75</text><path class="confucius-grid" data-tick="100" d="M94,188.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="192.00" text-anchor="end" font-size="13" fill="#6B6B6B">100</text><path class="confucius-grid" data-tick="125" d="M94,122.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="126.00" text-anchor="end" font-size="13" fill="#6B6B6B">125</text><text class="confucius-unit" x="94" y="105" font-size="14" fill="#6B6B6B">Institutes</text><text class="confucius-year" x="121.96" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2006</text><text class="confucius-year" x="308.33" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2010</text><text class="confucius-year" x="541.30" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2015</text><text class="confucius-year" x="774.26" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2020</text><text class="confucius-year" x="914.04" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2023</text><text x="518.0" y="513" text-anchor="middle" font-size="13" fill="#6B6B6B">Observation year</text><g class="confucius-mark" data-observation-id="nas_history_2006" data-value="11" data-bound="" data-qualifier="exact" data-reference="2006" data-observation-year="2006"><title>2006: 11 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text class="confucius-reported" x="121.96" y="410.96" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">11</text><rect class="confucius-bar" x="107.51" y="422.96" width="28.89" height="29.04" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_history_2007" data-value="31" data-bound="" data-qualifier="exact" data-reference="2007" data-observation-year="2007"><title>2007: 31 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text class="confucius-reported" x="168.55" y="358.16" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">31</text><rect class="confucius-bar" x="154.11" y="370.16" width="28.89" height="81.84" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="mfa_2014_institutes_reported" data-value="100" data-bound="" data-qualifier="exact" data-reference="2014-09-29" data-observation-year="2014"><title>Sep 29, 2014: 100 institutes. China Ministry of Foreign Affairs. Official statement; source counting definitions not independently harmonized.</title><text class="confucius-reported" x="494.70" y="176.00" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">100</text><rect class="confucius-bar" x="480.26" y="188.00" width="28.89" height="264.00" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_history_2015" data-value="109" data-bound="" data-qualifier="exact" data-reference="2015" data-observation-year="2015"><title>2015: 109 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text class="confucius-reported" x="541.30" y="152.24" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">109</text><rect class="confucius-bar" x="526.85" y="164.24" width="28.89" height="287.76" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_2017_institutes_reported" data-value="103" data-bound="" data-qualifier="exact" data-reference="2017" data-observation-year="2017"><title>Reported by 2017: 103 institutes. National Association of Scholars. Report-period snapshot from the April 2017 report, amended June 2017; no exact measurement month or end-of-year census is inferred.</title><text class="confucius-reported" x="634.48" y="168.08" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">103</text><rect class="confucius-bar" x="620.04" y="180.08" width="28.89" height="271.92" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="usc_nov2021" data-value="30" data-bound="" data-qualifier="exact" data-reference="2021-11-18" data-observation-year="2021"><title>Nov 18, 2021: 30 institutes. USC US-China Institute. Some included programs had announced future closures.</title><text class="confucius-reported" x="820.86" y="360.80" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">30</text><rect class="confucius-bar" x="806.41" y="372.80" width="28.89" height="79.20" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="crs_apr2022" data-value="18" data-bound="" data-qualifier="exact" data-reference="2022-04" data-observation-year="2022"><title>Apr 2022: 18 institutes. Congressional Research Service. Includes four announced closures, one institute under review and four non-college hosts. CRS attributes the count to NAS.</title><text class="confucius-reported" x="867.45" y="392.48" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">18</text><rect class="confucius-bar" x="853.01" y="404.48" width="28.89" height="47.52" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_listed_jun2023" data-value="10" data-bound="" data-qualifier="exact" data-reference="2023-06-22" data-observation-year="2023"><title>Reported by Jun 22, 2023: 10 institutes. National Association of Scholars. Includes non-university hosts and one paused program. Listed, not ten independently verified operating institutes.</title><text class="confucius-reported" x="914.04" y="413.60" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">10</text><rect class="confucius-bar" x="899.60" y="425.60" width="28.89" height="26.40" fill="#7B2D26" opacity="1"/></g><text class="confucius-source" x="42" y="542" font-size="12" fill="#6B6B6B">Sources: CRS, Foreign Ministry, NAS, NAS roster, USC. Different sources, not a harmonized annual census. The June</text><text class="confucius-source" x="42" y="559" font-size="12" fill="#6B6B6B">2023 roster includes non-university hosts and one paused institute. Announced closures are not effective closure</text><text class="confucius-source" x="42" y="576" font-size="12" fill="#6B6B6B">dates.</text></svg>
