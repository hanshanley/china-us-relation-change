<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-campus" data-axis-max="125.0" aria-label="Institutes at U.S. colleges and universities" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Institutes at U.S. colleges and universities</title><desc>Campus-only reports, not the all-host roster. GAO reports fewer than five as of July 2023, not exactly five. The December 2022 figure is approximate. No current total is inferred.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Institutes at U.S. colleges and universities</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Campus-only counts | bounds remain bounds</text><path d="M58.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="58.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">0</text><path d="M232.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="232.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">25</text><path d="M406.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="406.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">50</text><path d="M580.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="580.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">75</text><path d="M754.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="754.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">100</text><path d="M928.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="928.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">125</text><g class="confucius-mark" data-observation-id="gao_campus_2018" data-value="96" data-bound="" data-qualifier="exact" data-reference="2018-12"><title>Dec 2018: 96 institutes. U.S. Government Accountability Office. Confucius Institutes at U.S. colleges and universities</title><text x="58" y="122.00" font-size="14" fill="#1A1A1A">Dec 2018 &#183; GAO</text><text class="confucius-reported" x="928" y="122.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">96</text><rect class="confucius-bar" x="58" y="132.00" width="668.16" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="crs_dec2022" data-value="7" data-bound="" data-qualifier="approximate" data-reference="2022-12"><title>Dec 2022: About 7 institutes. Congressional Research Service. CRS reports the National Academies&#x27; college/university count, approximately seven.</title><text x="58" y="189.00" font-size="14" fill="#1A1A1A">Dec 2022 &#183; CRS</text><text class="confucius-reported" x="928" y="189.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">About 7</text><rect class="confucius-bar" x="58" y="199.00" width="48.72" height="11" fill="#7B2D26" opacity="0.6"/></g><g class="confucius-mark" data-observation-id="gao_campus_2023" data-value="" data-bound="5" data-qualifier="less_than" data-reference="2023-07"><title>Jul 2023: Fewer than 5 institutes. U.S. Government Accountability Office. Operating Confucius Institutes at U.S. colleges and universities</title><text x="58" y="256.00" font-size="14" fill="#1A1A1A">Jul 2023 &#183; GAO</text><text class="confucius-reported" x="928" y="256.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">Fewer than 5</text><path class="confucius-bound" d="M58.00,271.00H92.80" stroke="#7B2D26" fill="none" stroke-width="2" stroke-dasharray="4 4"/><circle class="confucius-boundary" cx="92.80" cy="271.00" r="4" fill="#F5F5F5" stroke="#7B2D26" stroke-width="2"/></g><text class="confucius-source" x="42" y="542" font-size="12" fill="#6B6B6B">Sources: CRS, GAO. Campus-only reports, not the all-host roster. GAO reports fewer than five as of July 2023, not</text><text class="confucius-source" x="42" y="559" font-size="12" fill="#6B6B6B">exactly five. The December 2022 figure is approximate. No current