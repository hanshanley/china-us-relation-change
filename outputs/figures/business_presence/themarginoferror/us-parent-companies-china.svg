" data-series-id="bea_parents:china" data-year="2004" data-value="581" cx="115.00" cy="347.38" r="4" fill="#7B2D26"><title>United States 2004: 581.0000 U.S. parents</title></circle><circle class="business-point" data-series-id="bea_parents:china" data-year="2009" data-value="841" cx="393.33" cy="314.88" r="4" fill="#7B2D26"><title>United States 2009: 841.0000 U.S. parents</title></circle><circle class="business-point" data-series-id="bea_parents:china" data-year="2014" data-value="1244" cx="671.67" cy="264.50" r="4" fill="#7B2D26"><title>United States 2014: 1,244.0000 U.S. parents</title></circle><circle class="business-point" data-series-id="bea_parents:china" data-year="2019" data-value="1134" cx="950.00" cy="278.25" r="4" fill="#7B2D26"><title>United States 2019: 1,134.0000 U.S. parents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">BEA benchmarks only: 2004, 2009, 2014 and 2019. Distinct reported U.S. parents, not annual affiliate</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">entities. Reporting exclusions and benchmark coverage differ. No annual interpolation or current company</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">census.</text></g></svg>
