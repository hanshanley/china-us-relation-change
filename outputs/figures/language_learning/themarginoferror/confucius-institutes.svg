<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-institutes" data-axis-max="125.0" aria-label="Confucius Institutes: reported U.S. counts" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Confucius Institutes: reported U.S. counts</title><desc>Different sources, not a harmonized annual census. The June 2023 roster includes non-university hosts and one paused institute. Announced closures are not effective closure dates.</desc><rect class="chart-background" width="1000" height="600" fill="#F7F5F0"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Confucius Institutes: reported U.S. counts</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Dated national snapshots | host coverage differs</text><path d="M58.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="58.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">0</text><path d="M232.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="232.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">25</text><path d="M406.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="406.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">50</text><path d="M580.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="580.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">75</text><path d="M754.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="754.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">100</text><path d="M928.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="928.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">125</text><g class="confucius-mark" data-observation-id="nas_history_2006" data-value="11" data-bound="" data-qualifier="exact" data-reference="2006"><title>2006: 11 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text x="58" y="122.00" font-size="14" fill="#1A1A1A">2006 &#183; NAS</text><text class="confucius-reported" x="928" y="122.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">11</text><rect class="confucius-bar" x="58" y="132.00" width="76.56" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_history_2007" data-value="31" data-bound="" data-qualifier="exact" data-reference="2007"><title>2007: 31 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text x="58" y="166.00" font-size="14" fill="#1A1A1A">2007 &#183; NAS</text><text class="confucius-reported" x="928" y="166.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">31</text><rect class="confucius-bar" x="58" y="176.00" width="215.76" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="mfa_2014_institutes_reported" data-value="100" data-bound="" data-qualifier="exact" data-reference="2014-09-29"><title>Sep 29, 2014: 100 institutes. China Ministry of Foreign Affairs. Official statement; source counting definitions not independently harmonized.</title><text x="58" y="210.00" font-size="14" fill="#1A1A1A">Sep 29, 2014 &#183; Foreign Ministry</text><text class="confucius-reported" x="928" y="210.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">100</text><rect class="confucius-bar" x="58" y="220.00" width="696.00" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_history_2015" data-value="109" data-bound="" data-qualifier="exact" data-reference="2015"><title>2015: 109 institutes. National Association of Scholars. Retrospective source count; no month/day or continuous annual series is inferred.</title><text x="58" y="254.00" font-size="14" fill="#1A1A1A">2015 &#183; NAS</text><text class="confucius-reported" x="928" y="254.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">109</text><rect class="confucius-bar" x="58" y="264.00" width="758.64" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_2017_institutes_reported" data-value="103" data-bound="" data-qualifier="exact" data-reference="2017"><title>Reported by 2017: 103 institutes. National Association of Scholars. Report-period snapshot from the April 2017 report, amended June 2017; no exact measurement month or end-of-year census is inferred.</title><text x="58" y="298.00" font-size="14" fill="#1A1A1A">Reported by 2017 &#183; NAS</text><text class="confucius-reported" x="928" y="298.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">103</text><rect class="confucius-bar" x="58" y="308.00" width="716.88" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="usc_nov2021" data-value="30" data-bound="" data-qualifier="exact" data-reference="2021-11-18"><title>Nov 18, 2021: 30 institutes. USC US-China Institute. Some included programs had announced future closures.</title><text x="58" y="342.00" font-size="14" fill="#1A1A1A">Nov 18, 2021 &#183; USC</text><text class="confucius-reported" x="928" y="342.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">30</text><rect class="confucius-bar" x="58" y="352.00" width="208.80" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="crs_apr2022" data-value="18" data-bound="" data-qualifier="exact" data-reference="2022-04"><title>Apr 2022: 18 institutes. Congressional Research Service. Includes four announced closures, one institute under review and four non-college hosts. CRS attributes the count to NAS.</title><text x="58" y="386.00" font-size="14" fill="#1A1A1A">Apr 2022 &#183; CRS</text><text class="confucius-reported" x="928" y="386.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">18</text><rect class="confucius-bar" x="58" y="396.00" width="125.28" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_listed_jun2023" data-value="10" data-bound="" data-qualifier="exact" data-reference="2023-06-22"><title>Reported by Jun 22, 2023: 10 institutes. National Association of Scholars. Includes non-university hosts and one paused program. Listed, not ten independently verified operating institutes.</title><text x="58" y="430.00" font-size="14" fill="#1A1A1A">Reported by Jun 22, 2023 &#183; NAS roster</text><text class="confucius-reported" x="928" y="430.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">10</text><rect class="confucius-bar" x="58" y="440.00" width="69.60" height="11" fill="#7B2D26" opacity="1"/></g><text class="confucius-source" x="42" y="542" font-size="12" fill="#6B6B6B">Sources: CRS, Foreign Ministry, NAS, NAS roster, USC. Different sources, not a harmonized annual census. The June</text><text class="confucius-source" x="42" y="559" font-size="12" fill="#6B6B6B">2023 roster includes non-university hosts and one paused institute. Announced closures are not effective closure</text><text class="confucius-source" x="42" y="576" font-size="12" fill="#6B6B6B">dates.</text></svg>
