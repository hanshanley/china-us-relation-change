<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Mandarin immersion program inventories"><title>Mandarin immersion program inventories</title><desc>Distinct educational indicators, not border crossings or a count of all learners. Exact observations and provenance accompany this figure.</desc><rect class="chart-background" width="1000" height="600" fill="#F7F5F0"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Mandarin immersion program inventories</text><text x="115" y="77" font-size="18">Different coverage definitions - not a comparable growth series</text><text class="axis-unit" x="115" y="145" font-size="18">Programs</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">200</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">400</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><rect class="language-point" data-series-id="schools:cal_directory" data-year="2011" data-value="71" x="189.17" y="375.62" width="130" height="44.38" fill="#7B2D26"/><text x="254.17" y="363.62" text-anchor="middle" fill="#1A1A1A">71</text><text x="254.17" y="450" text-anchor="middle">2011</text><text x="254.17" y="478" text-anchor="middle" font-size="18">CAL directory</text><rect class="language-point" data-series-id="schools:arc_public" data-year="2021" data-value="312" x="467.50" y="225.00" width="130" height="195.00" fill="#3D6F8C"/><text x="532.50" y="213.00" text-anchor="middle" fill="#1A1A1A">312</text><text x="532.50" y="450" text-anchor="middle">2021</text><text x="532.50" y="478" text-anchor="middle" font-size="18">Public-school DLI</text><rect class="language-point" data-series-id="schools:nexus_all" data-year="2025" data-value="335" x="745.83" y="210.62" width="130" height="209.38" fill="#C2993E"/><text x="810.83" y="198.62" text-anchor="middle" fill="#1A1A1A">335</text><text x="810.83" y="450" text-anchor="middle">2025</text><text x="810.83" y="478" text-anchor="middle" font-size="18">Mixed school types</text><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">CAL: immersion directory. ARC: public-school DLI canvass. Nexus: compiled inventory including private</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">schools. Different universes and methods; no growth rate or connecting trend is calculated.</text></g></svg>
