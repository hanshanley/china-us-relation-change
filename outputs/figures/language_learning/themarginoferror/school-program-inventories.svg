<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 5 938 552" role="img" aria-label="Mandarin immersion programs" data-presentation="essay"><title>Mandarin immersion programs</title><desc>U.S. language-learning indicators, with source-specific units and populations.</desc><rect class="chart-background" width="940" height="554" fill="#F7F5F0" x="25" y="4" /><g font-family="DejaVu Serif, Georgia, 'Times New Roman', serif" font-size="20" fill="#6B6B6B"><text x="40" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Mandarin immersion programs</text><text x="40" y="77" font-size="18">Different coverage definitions - not a comparable growth series</text><text class="axis-unit" x="115" y="145" font-size="18">Programs</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="301.00" text-anchor="end">200</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="176.00" text-anchor="end">400</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none" /><rect class="language-point" data-series-id="schools:cal_directory" data-year="2011" data-value="71" data-period="2011" data-reported-value="71" data-reported-unit="programs" data-status="observed" x="189.17" y="375.62" width="130" height="44.38" fill="#7B2D26" /><text x="254.17" y="363.62" text-anchor="middle" fill="#1A1A1A">71</text><text x="254.17" y="450" text-anchor="middle">2011</text><text x="254.17" y="478" text-anchor="middle" font-size="18">CAL directory</text><rect class="language-point" data-series-id="schools:arc_public" data-year="2021" data-value="312" data-period="2021" data-reported-value="312" data-reported-unit="programs" data-status="observed" x="467.50" y="225.00" width="130" height="195.00" fill="#3D6F8C" /><text x="532.50" y="213.00" text-anchor="middle" fill="#1A1A1A">312</text><text x="532.50" y="450" text-anchor="middle">2021</text><text x="532.50" y="478" text-anchor="middle" font-size="18">Public-school DLI</text><rect class="language-point" data-series-id="schools:nexus_all" data-year="2025" data-value="335" data-period="2025" data-reported-value="335" data-reported-unit="programs" data-status="observed" x="745.83" y="210.62" width="130" height="209.38" fill="#C2993E" /><text x="810.83" y="198.62" text-anchor="middle" fill="#1A1A1A">335</text><text x="810.83" y="450" text-anchor="middle">2025</text><text x="810.83" y="478" text-anchor="middle" font-size="18">Mixed school types</text><text class="figure-source" x="40" y="520" font-size="14" font-style="italic">CAL: immersion directory. ARC: public-school dual-language survey. Nexus: compiled inventory including</text><text class="figure-source" x="40" y="540" font-size="14" font-style="italic">private schools. The inventories cover different types of programs.</text></g></svg>
