<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-campus" data-chart-layout="timeline" data-axis-max="125.0" data-first-year="2018" data-last-year="2023" aria-label="Institutes at U.S. colleges and universities" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Institutes at U.S. colleges and universities</title><desc>Campus-only reports, not the all-host roster. GAO reports fewer than five as of July 2023, not exactly five. The December 2022 figure is approximate. No current total is inferred.</desc><rect class="chart-background" width="1000" height="600" fill="#F7F5F0"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Institutes at U.S. colleges and universities</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Campus-only counts | bounds remain bounds</text><path class="confucius-grid" data-tick="0" d="M94,452.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="456.00" text-anchor="end" font-size="13" fill="#6B6B6B">0</text><path class="confucius-grid" data-tick="25" d="M94,386.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="390.00" text-anchor="end" font-size="13" fill="#6B6B6B">25</text><path class="confucius-grid" data-tick="50" d="M94,320.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="324.00" text-anchor="end" font-size="13" fill="#6B6B6B">50</text><path class="confucius-grid" data-tick="75" d="M94,254.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="258.00" text-anchor="end" font-size="13" fill="#6B6B6B">75</text><path class="confucius-grid" data-tick="100" d="M94,188.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="192.00" text-anchor="end" font-size="13" fill="#6B6B6B">100</text><path class="confucius-grid" data-tick="125" d="M94,122.00H942" stroke="#D6D3CC" stroke-width=".7"/><text class="confucius-count-tick" x="82" y="126.00" text-anchor="end" font-size="13" fill="#6B6B6B">125</text><text class="confucius-unit" x="94" y="105" font-size="14" fill="#6B6B6B">Institutes</text><text class="confucius-year" x="176.06" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2018</text><text class="confucius-year" x="312.84" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2019</text><text class="confucius-year" x="449.61" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2020</text><text class="confucius-year" x="586.39" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2021</text><text class="confucius-year" x="723.16" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2022</text><text class="confucius-year" x="859.94" y="477" text-anchor="middle" font-size="14" fill="#6B6B6B">2023</text><text x="518.0" y="513" text-anchor="middle" font-size="13" fill="#6B6B6B">Observation year</text><g class="confucius-mark" data-observation-id="gao_campus_2018" data-value="96" data-bound="" data-qualifier="exact" data-reference="2018-12" data-observation-year="2018"><title>Dec 2018: 96 institutes. U.S. Government Accountability Office. Confucius Institutes at U.S. colleges and universities</title><text class="confucius-reported" x="176.06" y="186.56" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">96</text><rect class="confucius-bar" x="155.06" y="198.56" width="42.00" height="253.44" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="crs_dec2022" data-value="7" data-bound="" data-qualifier="approximate" data-reference="2022-12" data-observation-year="2022"><title>Dec 2022: About 7 institutes. Congressional Research Service. CRS reports the National Academies&#x27; college/university count, approximately seven.</title><text class="confucius-reported" x="723.16" y="421.52" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">About 7</text><rect class="confucius-bar" x="702.16" y="433.52" width="42.00" height="18.48" fill="#7B2D26" opacity="0.6"/></g><g class="confucius-mark" data-observation-id="gao_campus_2023" data-value="" data-bound="5" data-qualifier="less_than" data-reference="2023-07" data-observation-year="2023"><title>Jul 2023: Fewer than 5 institutes. U.S. Government Accountability Office. Operating Confucius Institutes at U.S. colleges and universities</title><text class="confucius-reported" x="859.94" y="426.80" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">Fewer than 5</text><path class="confucius-bound" d="M859.94,438.80V452" stroke="#7B2D26" fill="none" stroke-width="2" stroke-dasharray="4 4"/><circle class="confucius-boundary" cx="859.94" cy="438.80" r="4" fill="#F7F5F0" stroke="#7B2D26" stroke-width="2"/></g><text class="confucius-source" x="42" y="542" font-size="12" fill="#6B6B6B">Sources: CRS, GAO. Campus-only reports, not the all-host roster. GAO reports fewer than five as of July 2023, not</text><text class="confucius-source" x="42" y="559" font-size="12" fill="#6B6B6B">exactly five. The December 2022 figure is approximate. No current total is inferred.</text></svg>
