<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" data-confucius-chart="confucius-classrooms" data-axis-max="600" aria-label="Confucius Classrooms: historical U.S. reports" style="font-family:DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif"><title>Confucius Classrooms: historical U.S. reports</title><desc>National reports use different program/site counting rules. The 2024 inventory and today&#x27;s directory listings are not appended as active-classroom totals. No decline rate is calculated.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><text x="42" y="40" font-size="25" font-weight="700" fill="#1A1A1A">Confucius Classrooms: historical U.S. reports</text><text x="42" y="76" font-size="16" fill="#6B6B6B">Reported programs or school sites | not physical rooms</text><path d="M58.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="58.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">0</text><path d="M203.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="203.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">100</text><path d="M348.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="348.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">200</text><path d="M493.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="493.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">300</text><path d="M638.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="638.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">400</text><path d="M783.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="783.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">500</text><path d="M928.00,107V492" stroke="#D6D3CC" stroke-width=".7"/><text x="928.00" y="512" text-anchor="middle" font-size="13" fill="#6B6B6B">600</text><g class="confucius-mark" data-observation-id="mfa_2014_classrooms_reported" data-value="366" data-bound="" data-qualifier="exact" data-reference="2014-09-29"><title>Sep 29, 2014: 366 reported classrooms or school sites. China Ministry of Foreign Affairs. Official statement; source counting definitions not independently harmonized.</title><text x="58" y="122.00" font-size="14" fill="#1A1A1A">Sep 29, 2014 &#183; Foreign Ministry</text><text class="confucius-reported" x="928" y="122.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">366</text><rect class="confucius-bar" x="58" y="132.00" width="530.70" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="nas_2017_classrooms_reported" data-value="501" data-bound="" data-qualifier="exact" data-reference="2017"><title>Reported by 2017: 501 reported classrooms or school sites. National Association of Scholars. Report-period snapshot from the April 2017 report, amended June 2017; no exact measurement month or end-of-year census is inferred.</title><text x="58" y="189.00" font-size="14" fill="#1A1A1A">Reported by 2017 &#183; NAS</text><text class="confucius-reported" x="928" y="189.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">501</text><rect class="confucius-bar" x="58" y="199.00" width="726.45" height="11" fill="#7B2D26" opacity="1"/></g><g class="confucius-mark" data-observation-id="senate_classrooms_2019" data-value="519" data-bound="" data-qualifier="exact" data-reference="2019-02"><title>Reported by Feb 2019: 519 reported classrooms or school sites. U.S. Senate Permanent Subcommittee on Investigations. Reported classroom school sites; not physical classroom rooms.</title><text x="58" y="256.00" font-size="14" fill="#1A1A1A">Reported by Feb 2019 &#183; U.S. Senate</text><text class="confucius-reported" x="928" y="256.00" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">519</text><rect class="confucius-bar" x="58" y="266.00" width="752.55" height="11" fill="#7B2D26" opacity="1"/></g><text class="confucius-source" x="42" y="542" font-size="12" fill="#6B6B6B">Sources: Foreign Ministry, NAS, U.S. Senate. National reports use different program/site counting rules. The 2024</text><text class="confucius-source" x="42" y="559" font-size="12" fill="#6B6B6B">inventory and today&#x27;s directory listings are not appended as active-classroom totals. No decline rate is calculated.</text></svg>
