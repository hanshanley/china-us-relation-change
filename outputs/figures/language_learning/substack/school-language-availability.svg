<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 5 939 572" role="img" aria-label="Language classes in public schools" data-presentation="essay"><title>Language classes in public schools</title><desc>U.S. language-learning indicators, with source-specific units and populations.</desc><rect class="chart-background" width="941" height="574" fill="#F5F5F5" x="24" y="4" /><g font-family="DejaVu Serif, Georgia, 'Times New Roman', serif" font-size="20" fill="#6B6B6B"><text x="40" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Language classes in public schools</text><text x="40" y="77" font-size="18">Nationwide NCES sample | January 2024</text><text class="axis-unit" x="115" y="145" font-size="18">Percent</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="301.00" text-anchor="end">2</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="176.00" text-anchor="end">4</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none" /><rect class="language-point" data-series-id="spp_availability:chinese" data-year="2024" data-value="3" data-period="2024" data-reported-value="3" data-reported-unit="percent" data-status="estimated" x="258.75" y="232.50" width="130" height="187.50" fill="#7B2D26" /><text x="323.75" y="220.50" text-anchor="middle" fill="#1A1A1A">3</text><text x="323.75" y="450" text-anchor="middle">2024</text><text x="323.75" y="478" text-anchor="middle" font-size="18">Chinese</text><rect class="language-point" data-series-id="spp_availability:japanese" data-year="2024" data-value="1" data-period="2024" data-reported-value="1" data-reported-unit="percent" data-status="estimated" x="676.25" y="357.50" width="130" height="62.50" fill="#3D6F8C" /><text x="741.25" y="345.50" text-anchor="middle" fill="#1A1A1A">1</text><text x="741.25" y="450" text-anchor="middle">2024</text><text x="741.25" y="478" text-anchor="middle" font-size="18">Japanese</text><text class="figure-source" x="40" y="520" font-size="14" font-style="italic">NCES School Pulse Panel, January 2024; experimental national estimates. All U.S. public schools are the</text><text class="figure-source" x="40" y="540" font-size="14" font-style="italic">denominator; Chinese includes Mandarin or Cantonese. Standard errors: Chinese 0.4pp, Japanese 0.3pp.</text><text class="figure-source" x="40" y="560" font-size="14" font-style="italic">Korean estimates are not reportable. Course offerings are not student enrollments.</text></g></svg>
