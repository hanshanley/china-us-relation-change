<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="K-12 language-enrollment estimates"><title>K-12 language-enrollment estimates</title><desc>Distinct educational indicators, not border crossings or a count of all learners. Exact observations and provenance accompany this figure.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">K-12 language-enrollment estimates</text><text x="115" y="77" font-size="18">2014–15-era reference period | published in 2017</text><text class="axis-unit" x="115" y="145" font-size="18">Enrollments</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">150,000</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">300,000</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><rect class="language-point" data-series-id="schools:k12_estimate" data-year="2015" data-value="227086" x="258.75" y="230.76" width="130" height="189.24" fill="#7B2D26"/><text x="323.75" y="218.76" text-anchor="middle" fill="#1A1A1A">227,086</text><text x="323.75" y="450" text-anchor="middle">2015</text><text x="323.75" y="478" text-anchor="middle" font-size="18">Chinese</text><rect class="language-point" data-series-id="schools:k12_japanese_estimate" data-year="2015" data-value="67909" x="676.25" y="363.41" width="130" height="56.59" fill="#3D6F8C"/><text x="741.25" y="351.41" text-anchor="middle" fill="#1A1A1A">67,909</text><text x="741.25" y="450" text-anchor="middle">2015</text><text x="741.25" y="478" text-anchor="middle" font-size="18">Japanese</text><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">American Councils Table 2. Chinese/Japanese state reports plus modeled estimates for missing data; not</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">unique people. No comparable national Korean total is supplied. Its 936 respondent enrollments are not</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">mixed into these national estimates.</text></g></svg>
