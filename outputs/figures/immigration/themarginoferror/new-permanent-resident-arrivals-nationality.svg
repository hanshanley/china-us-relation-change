<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 5 939 572" role="img" aria-label="New permanent residents: Chinese nationals" data-plot-style="columns" data-presentation="essay"><title>New permanent residents: Chinese nationals</title><desc>Resident stocks and status grants have distinct periods and populations; not all physical arrivals. Shading marks the broad 2020-2022 travel-restriction period, not one policy's exact dates. COVID-19 context is not a universal ban or an estimate of COVID's effect. Rules, exemptions and reopening dates varied by destination and category. U.S. fiscal years run October-September; Macau approvals use calendar years. In-country status adjustments are not border arrivals.</desc><rect class="chart-background" width="941" height="574" fill="#F7F5F0" x="24" y="4" /><g font-family="DejaVu Serif, Georgia, 'Times New Roman', serif" font-size="20" fill="#6B6B6B"><text x="40" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">New permanent residents: Chinese nationals</text><text x="40" y="77" font-size="18">Chinese nationality | U.S. fiscal years 2016-2025</text><text class="axis-unit" x="115" y="145" font-size="18">People per fiscal year</text><g class="covid-context" pointer-events="none"><title>Shading marks 2020-2022, the main COVID travel-restriction years, not a universal travel ban. Rules, exemptions and reopening dates differed by destination; some measures continued into 2023. This is travel context, not a restriction on goods trade or a causal estimate.</title><rect class="covid-band" data-start-year="2020" data-end-year="2022" x="449.00" y="170" width="250.50" height="250" fill="#D6D3CC" fill-opacity=".3" pointer-events="none" /><text class="covid-label" x="574.25" y="160" text-anchor="middle" font-size="12" fill="#6B6B6B">COVID travel restrictions, 2020-22</text></g><path d="M115 108h25" stroke="#7B2D26" stroke-width="3" /><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">New arrivals</text><path d=