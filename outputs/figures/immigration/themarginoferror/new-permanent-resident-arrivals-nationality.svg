="25115" x="627.69" y="315.35" width="60.12" height="104.65" fill="#7B2D26" /><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2022" data-value="25115" data-period="FY2022" data-reported-value="25115" data-reported-unit="status grants" data-status="observed" cx="657.75" cy="315.35" r="0" fill="#7B2D26"><title>New arrivals 2022: 25,115.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2023" data-value="21890" x="711.19" y="328.79" width="60.12" height="91.21" fill="#7B2D26" /><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2023" data-value="21890" data-period="FY2023" data-reported-value="21890" data-reported-unit="status grants" data-status="rounded" cx="741.25" cy="328.79" r="0" fill="#7B2D26"><title>New arrivals 2023: 21,890.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2024" data-value="23570" x="794.69" y="321.79" width="60.12" height="98.21" fill="#7B2D26" /><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2024" data-value="23570" data-period="FY2024" data-reported-value="23570" data-reported-unit="status grants" data-status="rounded" cx="824.75" cy="321.79" r="0" fill="#7B2D26"><title>New arrivals 2024: 23,570.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2025" data-value="27020" x="878.19" y="307.42" width="60.12" height="112.58" fill="#7B2D26" /><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2025" data-value="27020" data-period="FY2025" data-reported-value="27020" data-reported-unit="status grants" data-status="rounded" cx="908.25" cy="307.42" r="0" fill="#7B2D26"><title>New arrivals 2025: 27,020.0000 People per fiscal year</title></circle><text class="figure-source" x="40" y="520" font-size="14" font-style="italic">DHS/OHSS Q4 tables. FY2016-2018 tables corrected to nationality in September 2019. New arrivals by</text><text class="figure-source" x="40" y="540" font-size="14" font-style="italic">nationality, not birthplace; excludes in-country adjustments. Fiscal years end September 30; later counts</text><text class="figure-source" x="40" y="560" font-size="14" font-style="italic">rounded to ten. COVID context: restrictions and processing varied; not a universal ban.</text></g></svg>
