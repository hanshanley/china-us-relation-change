<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="China to the U.S.: annual permanent immigration" data-plot-style="columns"><title>China to the U.S.: annual permanent immigration</title><desc>Resident stocks and status grants have distinct periods and populations; not all physical arrivals.</desc><rect class="chart-background" width="1000" height="600" fill="#F7F5F0"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">China to the U.S.: annual permanent immigration</text><text x="115" y="77" font-size="18">Chinese nationality | U.S. fiscal years 2020-2025</text><text class="axis-unit" x="115" y="145" font-size="18">People per fiscal year</text><rect class="covid-band" data-start-year="2020" data-end-year="2022" x="115.00" y="170" width="417.50" height="250" fill="#D6D3CC" fill-opacity=".3" pointer-events="none"/><text class="covid-label" x="323.75" y="160" text-anchor="middle" font-size="12" fill="#6B6B6B">COVID travel restrictions</text><path d="M115 108h25" stroke="#7B2D26" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">New arrivals</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">20k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">40k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="184.58" y="457" text-anchor="middle" font-size="18">2020</text><text class="year-tick" x="880.42" y="457" text-anchor="middle" font-size="18">2025</text><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2020" data-value="12726" x="152.58" y="340.46" width="64.00" height="79.54" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2020" data-value="12726" data-period="FY2020" data-reported-value="12726" data-reported-unit="status grants" data-status="observed" cx="184.58" cy="340.46" r="0" fill="#7B2D26"><title>New arrivals 2020: 12,726.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2021" data-value="11278" x="291.75" y="349.51" width="64.00" height="70.49" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2021" data-value="11278" data-period="FY2021" data-reported-value="11278" data-reported-unit="status grants" data-status="observed" cx="323.75" cy="349.51" r="0" fill="#7B2D26"><title>New arrivals 2021: 11,278.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2022" data-value="25115" x="430.92" y="263.03" width="64.00" height="156.97" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2022" data-value="25115" data-period="FY2022" data-reported-value="25115" data-reported-unit="status grants" data-status="observed" cx="462.92" cy="263.03" r="0" fill="#7B2D26"><title>New arrivals 2022: 25,115.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2023" data-value="21890" x="570.08" y="283.19" width="64.00" height="136.81" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2023" data-value="21890" data-period="FY2023" data-reported-value="21890" data-reported-unit="status grants" data-status="rounded" cx="602.08" cy="283.19" r="0" fill="#7B2D26"><title>New arrivals 2023: 21,890.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2024" data-value="23570" x="709.25" y="272.69" width="64.00" height="147.31" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2024" data-value="23570" data-period="FY2024" data-reported-value="23570" data-reported-unit="status grants" data-status="rounded" cx="741.25" cy="272.69" r="0" fill="#7B2D26"><title>New arrivals 2024: 23,570.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:new_arrivals" data-year="2025" data-value="27020" x="848.42" y="251.12" width="64.00" height="168.88" fill="#7B2D26"/><circle class="immigration-point" data-series-id="ohss_nationality:new_arrivals" data-year="2025" data-value="27020" data-period="FY2025" data-reported-value="27020" data-reported-unit="status grants" data-status="rounded" cx="880.42" cy="251.12" r="0" fill="#7B2D26"><title>New arrivals 2025: 27,020.0000 People per fiscal year</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">DHS/OHSS Table 1A. New arrivals enter as permanent residents; adjustments concern people already in the</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">U.S. Nationality is not birthplace or previous residence. Later releases round to ten; earlier releases</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">retain reported counts. No comparable annual U.S.-to-mainland-China count has been verified; resident</text><text class="figure-source" x="115" y="580" font-size="14" font-style="italic">stocks are separate.</text></g></svg>
