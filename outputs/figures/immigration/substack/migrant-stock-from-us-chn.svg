<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="U.S. citizens in China; U.S.-born in Hong Kong" data-plot-style="columns" data-geographies="CHN" data-first-year="2000" data-last-year="2024"><title>U.S. citizens in China; U.S.-born in Hong Kong</title><desc>Same observation years; separate vertical scales. Resident stocks and status grants have distinct periods and populations; not all physical arrivals.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">U.S. citizens in China; U.S.-born in Hong Kong</text><text x="115" y="77" font-size="18">Mainland China | UN estimates | distinct citizenship and birthplace populations</text><text class="axis-unit" x="115" y="145" font-size="18">Estimated residents</text><path d="M115 108h25" stroke="#7B2D26" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">U.S. citizens in mainland China</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">45k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">90k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="131.70" y="457" text-anchor="middle" font-size="18">2000</text><text class="year-tick" x="298.70" y="457" text-anchor="middle" font-size="18">2005</text><text class="year-tick" x="465.70" y="457" text-anchor="middle" font-size="18">2010</text><text class="year-tick" x="632.70" y="457" text-anchor="middle" font-size="18">2015</text><text class="year-tick" x="799.70" y="457" text-anchor="middle" font-size="18">2020</text><text class="year-tick" x="933.30" y="457" text-anchor="middle" font-size="18">2024</text><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2000" data-value="49655" x="119.68" y="282.07" width="24.05" height="137.93" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2000" data-value="49655" data-period="1 July 2000" data-reported-value="49655" data-reported-unit="estimated residents" data-status="estimated" cx="131.70" cy="282.07" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2000: 49,655.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2005" data-value="59103" x="286.68" y="255.83" width="24.05" height="164.17" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2005" data-value="59103" data-period="1 July 2005" data-reported-value="59103" data-reported-unit="estimated residents" data-status="estimated" cx="298.70" cy="255.83" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2005: 59,103.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2010" data-value="69836" x="453.68" y="226.01" width="24.05" height="193.99" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2010" data-value="69836" data-period="1 July 2010" data-reported-value="69836" data-reported-unit="estimated residents" data-status="estimated" cx="465.70" cy="226.01" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2010: 69,836.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2015" data-value="63341" x="620.68" y="244.05" width="24.05" height="175.95" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2015" data-value="63341" data-period="1 July 2015" data-reported-value="63341" data-reported-unit="estimated residents" data-status="estimated" cx="632.70" cy="244.05" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2015: 63,341.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2020" data-value="55280" x="787.68" y="266.44" width="24.05" height="153.56" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2020" data-value="55280" data-period="1 July 2020" data-reported-value="55280" data-reported-unit="estimated residents" data-status="estimated" cx="799.70" cy="266.44" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2020: 55,280.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:CHN" data-year="2024" data-value="60434" x="921.28" y="252.13" width="24.05" height="167.87" fill="#7B2D26"/><circle class="immigration-point" data-series-id="un_stock:USA:CHN" data-year="2024" data-value="60434" data-period="1 July 2024" data-reported-value="60434" data-reported-unit="estimated residents" data-status="estimated" cx="933.30" cy="252.13" r="0" fill="#7B2D26"><title>U.S. citizens in mainland China 2024: 60,434.0000 Estimated residents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">UN DESA, International Migrant Stock 2024 (CC BY 3.0 IGO). Mainland China uses U.S. citizenship (C R);</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">Hong Kong uses U.S. birthplace (B R). Stocks on 1 July, not new immigrants, permanent-residency grants or</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">U.S. departures. Do not add the two populations.</text></g></svg>
