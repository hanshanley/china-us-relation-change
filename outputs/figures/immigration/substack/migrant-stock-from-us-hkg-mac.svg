261" data-reported-unit="estimated residents" data-status="estimated" cx="632.70" cy="254.24" r="0" fill="#3D6F8C"><title>U.S.-born in Hong Kong 2015: 13,261.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:HKG" data-year="2020" data-value="13827" x="787.68" y="247.16" width="24.05" height="172.84" fill="#3D6F8C"/><circle class="immigration-point" data-series-id="un_stock:USA:HKG" data-year="2020" data-value="13827" data-period="1 July 2020" data-reported-value="13827" data-reported-unit="estimated residents" data-status="estimated" cx="799.70" cy="247.16" r="0" fill="#3D6F8C"><title>U.S.-born in Hong Kong 2020: 13,827.0000 Estimated residents</title></circle><rect class="annual-column" data-series-id="un_stock:USA:HKG" data-year="2024" data-value="14298" x="921.28" y="241.28" width="24.05" height="178.72" fill="#3D6F8C"/><circle class="immigration-point" data-series-id="un_stock:USA:HKG" data-year="2024" data-value="14298" data-period="1 July 2024" data-reported-value="14298" data-reported-unit="estimated residents" data-status="estimated" cx="933.30" cy="241.28" r="0" fill="#3D6F8C"><title>U.S.-born in Hong Kong 2024: 14,298.0000 Estimated residents</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">UN DESA, International Migrant Stock 2024 (CC BY 3.0 IGO). Mainland China uses U.S. citizenship (C R);</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">Hong Kong uses U.S. birthplace (B R). Stocks on 1 July, not new immigrants, permanent-residency grants or</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">U.S. departures. Do not add the two populations.</text></g></svg>
