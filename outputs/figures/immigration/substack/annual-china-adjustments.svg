<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Chinese nationals gaining residency while in the U.S." data-plot-style="columns"><title>Chinese nationals gaining residency while in the U.S.</title><desc>Resident stocks and status grants have distinct periods and populations; not all physical arrivals. USCIS suspended routine in-person services March 18, 2020; phased reopening began June 4, 2020. COVID-19 context is not a universal ban or an estimate of COVID&#x27;s effect. Rules, exemptions and reopening dates varied by destination and category. U.S. fiscal years run October-September; Macau approvals use calendar years. In-country status adjustments are not border arrivals.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Chinese nationals gaining residency while in the U.S.</text><text x="115" y="77" font-size="18">Status adjustments | U.S. fiscal years 2016-2025</text><text class="axis-unit" x="115" y="145" font-size="18">People per fiscal year</text><path d="M115 108h25" stroke="#6B6B6B" stroke-width="3"/><text class="legend-label" x="148" y="114" font-size="17" fill="#1A1A1A">Adjustments within the U.S.</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">30k</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">60k</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><text class="year-tick" x="156.75" y="457" text-anchor="middle" font-size="18">2016</text><text class="year-tick" x="490.75" y="457" text-anchor="middle" font-size="18">2020</text><text class="year-tick" x="908.25" y="457" text-anchor="middle" font-size="18">2025</text><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2016" data-value="38117" x="126.69" y="261.18" width="60.12" height="158.82" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2016" data-value="38117" data-period="FY2016" data-reported-value="38117" data-reported-unit="status grants" data-status="observed" cx="156.75" cy="261.18" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2016: 38,117.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2017" data-value="33932" x="210.19" y="278.62" width="60.12" height="141.38" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2017" data-value="33932" data-period="FY2017" data-reported-value="33932" data-reported-unit="status grants" data-status="observed" cx="240.25" cy="278.62" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2017: 33,932.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2018" data-value="35591" x="293.69" y="271.70" width="60.12" height="148.30" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2018" data-value="35591" data-period="FY2018" data-reported-value="35591" data-reported-unit="status grants" data-status="observed" cx="323.75" cy="271.70" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2018: 35,591.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2019" data-value="35340" x="377.19" y="272.75" width="60.12" height="147.25" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2019" data-value="35340" data-period="FY2019" data-reported-value="35340" data-reported-unit="status grants" data-status="observed" cx="407.25" cy="272.75" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2019: 35,340.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2020" data-value="29023" x="460.69" y="299.07" width="60.12" height="120.93" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2020" data-value="29023" data-period="FY2020" data-reported-value="29023" data-reported-unit="status grants" data-status="observed" cx="490.75" cy="299.07" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2020: 29,023.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2021" data-value="38412" x="544.19" y="259.95" width="60.12" height="160.05" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2021" data-value="38412" data-period="FY2021" data-reported-value="38412" data-reported-unit="status grants" data-status="observed" cx="574.25" cy="259.95" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2021: 38,412.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2022" data-value="42985" x="627.69" y="240.90" width="60.12" height="179.10" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2022" data-value="42985" data-period="FY2022" data-reported-value="42985" data-reported-unit="status grants" data-status="observed" cx="657.75" cy="240.90" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2022: 42,985.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2023" data-value="36940" x="711.19" y="266.08" width="60.12" height="153.92" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2023" data-value="36940" data-period="FY2023" data-reported-value="36940" data-reported-unit="status grants" data-status="rounded" cx="741.25" cy="266.08" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2023: 36,940.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2024" data-value="46530" x="794.69" y="226.12" width="60.12" height="193.88" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2024" data-value="46530" data-period="FY2024" data-reported-value="46530" data-reported-unit="status grants" data-status="rounded" cx="824.75" cy="226.12" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2024: 46,530.0000 People per fiscal year</title></circle><rect class="annual-column" data-series-id="ohss_nationality:adjustments" data-year="2025" data-value="38650" x="878.19" y="258.96" width="60.12" height="161.04" fill="#6B6B6B"/><circle class="immigration-point" data-series-id="ohss_nationality:adjustments" data-year="2025" data-value="38650" data-period="FY2025" data-reported-value="38650" data-reported-unit="status grants" data-status="rounded" cx="908.25" cy="258.96" r="0" fill="#6B6B6B"><title>Adjustments within the U.S. 2025: 38,650.0000 People per fiscal year</title></circle><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">DHS/OHSS. These people were already in the U.S.; the year of permanent-residency approval is not their</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">year of arrival. Do not add them to a chart labelled new arrivals. FY2016-FY2018 tables were corrected</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">from birthplace to nationality in September 2019; the observation fiscal years are unchanged. COVID: in-</text><text class="figure-source" x="115" y="580" font-size="14" font-style="italic">person services paused March 18-June 4, 2020; not a universal ban.</text></g></svg>
