<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Chinese views of the U.S. by age" data-axis-max="100"><title>Chinese views of the U.S. by age</title><desc>Reported survey estimates. Percent favorable and 0-100 mean ratings are separate measures; actual age bands and survey periods are retained.</desc><rect class="chart-background" width="1000" height="600" fill="#F5F5F5"/><g font-family="DejaVu Serif, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="20" fill="#6B6B6B"><text x="115" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Chinese views of the U.S. by age</text><text x="115" y="77" font-size="18">China Pulse | April 16-June 26, 2026</text><text class="axis-unit" x="115" y="145" font-size="18">Mean warmth (0-100)</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="301.00" text-anchor="end">50</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5"/><text x="100" y="176.00" text-anchor="end">100</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none"/><rect class="opinion-point" data-series-id="pulse_age:18-29" data-year="2026" data-label="18-29" data-value="32.0" data-period="Apr-Jun 2026" data-reported-value="32.0" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="154.38" y="340.00" width="130" height="80.00" fill="#7B2D26"/><text x="219.38" y="328.00" text-anchor="middle" fill="#1A1A1A">32</text><text x="219.38" y="450" text-anchor="middle" font-size="18">18-29</text><rect class="opinion-point" data-series-id="pulse_age:30-39" data-year="2026" data-label="30-39" data-value="29.0" data-period="Apr-Jun 2026" data-reported-value="29.0" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="363.12" y="347.50" width="130" height="72.50" fill="#7B2D26"/><text x="428.12" y="335.50" text-anchor="middle" fill="#1A1A1A">29</text><text x="428.12" y="450" text-anchor="middle" font-size="18">30-39</text><rect class="opinion-point" data-series-id="pulse_age:40-49" data-year="2026" data-label="40-49" data-value="32.0" data-period="Apr-Jun 2026" data-reported-value="32.0" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="571.88" y="340.00" width="130" height="80.00" fill="#7B2D26"/><text x="636.88" y="328.00" text-anchor="middle" fill="#1A1A1A">32</text><text x="636.88" y="450" text-anchor="middle" font-size="18">40-49</text><rect class="opinion-point" data-series-id="pulse_age:50+" data-year="2026" data-label="50+" data-value="33.0" data-period="Apr-Jun 2026" data-reported-value="33.0" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="780.62" y="337.50" width="130" height="82.50" fill="#7B2D26"/><text x="845.62" y="325.50" text-anchor="middle" fill="#1A1A1A">33</text><text x="845.62" y="450" text-anchor="middle" font-size="18">50+</text><text class="figure-source" x="115" y="520" font-size="14" font-style="italic">The Carter Center / Emory University, October 2026 weighted results. Quota respondent panel, full wave</text><text class="figure-source" x="115" y="540" font-size="14" font-style="italic">n=2,500; age-specific bases are not supplied. The 18-29 group is not interchangeable with the U.S. 18-34</text><text class="figure-source" x="115" y="560" font-size="14" font-style="italic">group.</text></g></svg>
