<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 5 939 570" role="img" aria-label="Americans' feelings toward China by age" data-axis-max="100" data-presentation="essay"><title>Americans' feelings toward China by age</title><desc>Reported survey estimates. Percent favorable and 0-100 mean ratings are separate measures; actual age bands and survey periods are retained.</desc><rect class="chart-background" width="941" height="572" fill="#F5F5F5" x="24" y="4" /><g font-family="DejaVu Serif, Georgia, 'Times New Roman', serif" font-size="20" fill="#6B6B6B"><text x="40" y="40" font-size="27" font-weight="bold" fill="#1A1A1A">Americans' feelings toward China by age</text><text x="40" y="77" font-size="18">Pew Research Center | September 14-20, 2026</text><text class="axis-unit" x="115" y="145" font-size="18">Mean warmth (0-100)</text><path d="M115 420.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="426.00" text-anchor="end">0</text><path d="M115 295.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="301.00" text-anchor="end">50</text><path d="M115 170.00H950" stroke="#D6D3CC" stroke-opacity=".6" stroke-width=".5" /><text x="100" y="176.00" text-anchor="end">100</text><path d="M115 170V420H950" stroke="#D6D3CC" stroke-width=".8" fill="none" /><rect class="opinion-point" data-series-id="pew_warmth_age:18-49" data-year="2026" data-label="18-49" data-value="42" data-period="September 2026" data-reported-value="42" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="258.75" y="315.00" width="130" height="105.00" fill="#3D6F8C" /><text x="323.75" y="303.00" text-anchor="middle" fill="#1A1A1A">42</text><text x="323.75" y="450" text-anchor="middle" font-size="18">18-49</text><rect class="opinion-point" data-series-id="pew_warmth_age:50+" data-year="2026" data-label="50+" data-value="31" data-period="September 2026" data-reported-value="31" data-reported-unit="Mean warmth (0-100)" data-status="observed" x="676.25" y="342.50" width="130" height="77.50" fill="#3D6F8C" /><text x="741.25" y="330.50" text-anchor="middle" fill="#1A1A1A">31</text><text x="741.25" y="450" text-anchor="middle" font-size="18">50+</text><text class="figure-source" x="40" y="520" font-size="14" font-style="italic">Pew Research Center, September 2026. Published mean ratings, with 50 neutral. This question and its age</text><text class="figure-source" x="40" y="540" font-size="14" font-style="italic">bands differ from the March favorability question. The figures do not measure participation in a social-</text><text class="figure-source" x="40" y="560" font-size="14" font-style="italic">media trend.</text></g></svg>
