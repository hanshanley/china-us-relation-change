="315.01" r="4" fill="#7B2D26"><title>2025: 842,000</title></circle><text class="figure-source" x="115" y="520" font-size="16" font-style="italic">Source: U.S. National Travel and Tourism Office / SIAT. Annual observations; missing years</text><text class="figure-source" x="115" y="543" font-size="16" font-style="italic">and definition changes are not connected.</text></g></svg>
